<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #sh-halo { position: absolute; left: 140px; top: 360px; width: 800px; height: 800px; border-radius: 50%; background: radial-gradient(circle, rgba(201, 208, 168, 0.35) 0%, rgba(201, 208, 168, 0.08) 45%, rgba(201, 208, 168, 0) 70%); }
    #sh-ring { position: absolute; left: 190px; top: 410px; width: 700px; height: 700px; }
    #sh-deck { position: absolute; inset: 0; }
    #sh-deck .tcard { left: 450px; top: 607px; width: 180px; height: 306px; }
    #sh-deck .tcard .face { border-radius: 14px; }
    .sh-lbl { position: absolute; top: 780px; width: 260px; text-align: center; font-family: "Nunito", sans-serif; font-weight: 900; font-size: 30px; color: #e8c27a; }
    #sh-l0 { left: 90px; } #sh-l1 { left: 410px; } #sh-l2 { left: 730px; }
    #sh-done { left: 380px; top: 860px; font-size: 80px; padding: 18px 48px 24px; }
    #sh-load { position: absolute; left: 240px; top: 1010px; width: 600px; height: 92px; border-radius: 46px; background: rgba(246, 239, 223, 0.12); border: 3px solid rgba(232, 194, 122, 0.6); display: flex; align-items: center; padding: 0 30px; gap: 18px; font-family: "Nunito", sans-serif; font-weight: 900; font-size: 32px; color: #f6efdf; overflow: hidden; }
    #sh-bar { position: absolute; left: 0; bottom: 0; height: 8px; width: 600px; background: #e8c27a; transform-origin: 0 50%; }
    #sh-moon { width: 44px; height: 44px; }
    #sh-cat { left: 700px; top: 1360px; width: 330px; height: 392px; }
    #sh-iris { position: absolute; inset: 0; background: #f6efdf; }
  </style>
  <div id="root" data-composition-id="shuffle" data-width="1080" data-height="1920">
    <div class="bg-navy"></div>
    <div id="sh-halo"></div>
    <svg id="sh-ring" viewBox="0 0 700 700"><circle cx="350" cy="350" r="330" fill="none" stroke="#E8C27A" stroke-width="2" stroke-dasharray="2 14" opacity=".55"/><circle cx="350" cy="350" r="290" fill="none" stroke="#C9D0A8" stroke-width="1.5" opacity=".3"/></svg>
    <canvas id="sh-fx" class="fx-canvas" width="1080" height="1920"></canvas>
    <div id="sh-deck" data-layout-allow-overflow data-layout-allow-overlap></div>
    <div class="sh-lbl" id="sh-l0">Quá khứ</div>
    <div class="sh-lbl" id="sh-l1">Hiện tại</div>
    <div class="sh-lbl" id="sh-l2">Tương lai</div>
    <div id="sh-done" class="sticker" data-layout-allow-overlap data-layout-allow-occlusion>Xong!</div>
    <div id="sh-load"><svg id="sh-moon" viewBox="0 0 40 40"><path d="M26 4 A16 16 0 1 0 26 36 A13 13 0 1 1 26 4Z" fill="#E8C27A"/></svg><span>Đang luận giải</span><span id="sh-dots">...</span><div id="sh-bar"></div></div>
    <div id="sh-cat" class="cat-host" data-layout-allow-overflow></div>
    <div id="sh-iris"></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const N = 16;
      const CHOSEN = [3, 8, 13];
      const FRONTS = { 3: "ten-of-cups", 8: "judgement", 13: "star" };
      const deck = document.getElementById("sh-deck");
      let html = "";
      for (let i = 0; i < N; i++) {
        const front = FRONTS[i] ? '<img src="assets/cards/' + FRONTS[i] + '.jpg" alt="" />' : "";
        html += '<div class="tcard" id="sh-c' + i + '"><div class="inner"><div class="face back back-flora"></div><div class="face front">' + front + "</div></div></div>";
      }
      deck.innerHTML = html;
      const cards = Array.from({ length: N }, (_, i) => document.getElementById("sh-c" + i));
      const cat = EF.mountCat(document.getElementById("sh-cat"));

      // ---------- helpers ----------
      const clamp = (v) => Math.max(0, Math.min(1, v));
      const eOut = (p) => 1 - Math.pow(1 - p, 3);
      const eExpo = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
      const eInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
      const eBack = (p) => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
      const lerp = (a, b, p) => a + (b - a) * p;
      const r0 = EF.rng(77);
      const jitter = cards.map(() => ({ r: (r0() - 0.5) * 5, x: (r0() - 0.5) * 6 }));
      const stack = (i) => ({ x: jitter[i].x + i * 0.5, y: -i * 1.4, r: jitter[i].r, s: 1 });

      // physics scatter, simulated once (deterministic) at 240 Hz
      const SIM_T = 0.5, DT = 1 / 240, FLOOR = 520, WALL = 430;
      const sim = cards.map((_, i) => {
        const r = EF.rng(500 + i);
        let p = stack(i), x = p.x, y = p.y, rot = p.r;
        let vx = (r() - 0.5) * 2200, vy = -700 - r() * 1100, vr = (r() - 0.5) * 1100;
        const frames = [];
        for (let k = 0; k <= SIM_T / DT + 1; k++) {
          frames.push([x, y, rot]);
          vy += 3200 * DT; x += vx * DT; y += vy * DT; rot += vr * DT;
          if (y > FLOOR) { y = FLOOR; vy *= -0.42; vx *= 0.75; vr *= 0.6; }
          if (Math.abs(x) > WALL) { x = Math.sign(x) * WALL; vx *= -0.5; }
          vx *= 0.998; vr *= 0.995;
        }
        return frames;
      });
      const simAt = (i, u) => {
        const f = Math.min(sim[i].length - 1, u / DT); const k = Math.floor(f), a = f - k;
        const A = sim[i][k], B = sim[i][Math.min(k + 1, sim[i].length - 1)];
        return { x: lerp(A[0], B[0], a), y: lerp(A[1], B[1], a), r: lerp(A[2], B[2], a), s: 1 };
      };
      // fan (rải bài) positions
      const R = 900;
      const fan = (i) => { const a = ((i / (N - 1)) - 0.5) * 52 * Math.PI / 180; return { x: R * Math.sin(a), y: 60 + R * (1 - Math.cos(a)), r: a * 180 / Math.PI, s: 1 }; };
      const SLOT = [{ x: -320, y: -330 }, { x: 0, y: -330 }, { x: 320, y: -330 }];

      function state(i, t) {
        // A: appear
        if (t < 0.3) { const p = clamp(t / 0.28); const s = stack(i); return { ...s, s: lerp(0.4, 1, eBack(p)), o: clamp(t / 0.1) }; }
        // B: riffle — split then interleave
        if (t < 1.0) {
          const side = i % 2 ? 1 : -1, s = stack(i);
          const split = { x: s.x + side * 210, y: s.y + 10, r: side * 12, s: 1 };
          if (t < 0.62) { const p = eOut(clamp((t - 0.3) / 0.28)); return { x: lerp(s.x, split.x, p), y: lerp(s.y, split.y, p), r: lerp(s.r, split.r, p), s: 1, o: 1 }; }
          const ti = 0.62 + i * 0.021; const p = eOut(clamp((t - ti) / 0.12));
          return { x: lerp(split.x, s.x, p), y: lerp(split.y, s.y, p) - Math.sin(p * Math.PI) * 30, r: lerp(split.r, s.r, p), s: 1, o: 1 };
        }
        // C: physics scatter, then gather
        if (t < 1.5) { return { ...simAt(i, t - 1.0), o: 1 }; }
        if (t < 1.88) { const a = simAt(i, SIM_T), s = stack(i), p = eInOut(clamp((t - 1.5 - i * 0.008) / 0.3)); return { x: lerp(a.x, s.x, p), y: lerp(a.y, s.y, p), r: lerp(a.r, s.r, p), s: 1, o: 1 }; }
        // D: spread into a fan, sliding with friction
        const s = stack(i), f = fan(i), pf = eExpo(clamp((t - 1.88 - i * 0.022) / 0.6));
        let st = { x: lerp(s.x, f.x, pf), y: lerp(s.y, f.y, pf), r: lerp(s.r, f.r, pf), s: 1, o: 1 };
        const k = CHOSEN.indexOf(i);
        if (k >= 0) {
          // E: chosen card lifts out and flies to its slot
          const tc = 2.2 + k * 0.25;
          const lift = eOut(clamp((t - tc) / 0.1));
          const fly = eOut(clamp((t - tc - 0.08) / 0.32));
          const up = { x: st.x, y: st.y - 110 * lift, r: st.r };
          return { x: lerp(up.x, SLOT[k].x, fly), y: lerp(up.y, SLOT[k].y, fly), r: lerp(up.r, 0, fly), s: lerp(1, 1.25, fly), o: 1, z: t > tc ? 100 + k : i };
        }
        // F: the rest of the fan settles down and fades
        const pd = eInOut(clamp((t - 3.0) / 0.5)), pg = clamp((t - 4.4) / 0.4);
        return { x: st.x, y: st.y + 200 * pd, r: st.r, s: 1, o: lerp(1, 0.35, pd) * (1 - pg) };
      }

      const fx = EF.starfield(document.getElementById("sh-fx"), { n: 150, seed: 71, big: 14 });
      const bursts = [
        { t: 0.3, x: 540, y: 760, n: 14, spread: 220, seed: 81 },
        { t: 1.0, x: 540, y: 760, n: 24, spread: 380, seed: 82 },
        { t: 3.22, x: 220, y: 430, n: 26, seed: 83 },
        { t: 3.54, x: 540, y: 430, n: 26, seed: 84 },
        { t: 3.86, x: 860, y: 430, n: 26, seed: 85 },
        { t: 4.62, x: 540, y: 920, n: 40, spread: 460, seed: 86, size: 22 },
      ];
      function render(t) {
        fx(t, bursts);
        for (let i = 0; i < N; i++) {
          const s = state(i, t);
          gsap.set(cards[i], { x: s.x, y: s.y, rotation: s.r, scale: s.s, opacity: s.o == null ? 1 : s.o, zIndex: s.z != null ? s.z : i });
        }
      }
      EF.drive(tl, 7, render);

      // ring turns slowly (world, not UI)
      tl.fromTo("#sh-ring", { rotation: 0 }, { rotation: 40, duration: 7, ease: "none" }, 0);
      tl.fromTo("#sh-halo", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, 0);

      // 3D flips on the three chosen cards
      CHOSEN.forEach((i, k) => {
        const t = 3.1 + k * 0.32;
        tl.fromTo("#sh-c" + i + " .inner", { rotationY: 0 }, { rotationY: 180, duration: 0.45, ease: "back.out(1.7)" }, t);
        tl.fromTo("#sh-l" + k, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, t + 0.15);
      });

      // "Xong!" + cat cheers
      tl.fromTo("#sh-done", { scale: 0, rotation: -25 }, { scale: 1, rotation: -6, duration: 0.45, ease: "back.out(2.6)" }, 4.58);
      tl.to("#sh-done", { scale: 0, opacity: 0, duration: 0.2, ease: "power3.in" }, 5.4);
      tl.fromTo("#sh-cat", { y: 560, rotation: -10 }, { y: 0, rotation: -6, duration: 0.42, ease: "back.out(1.6)" }, 4.5);
      tl.fromTo([cat.armL, cat.armR], { rotation: 0 }, { rotation: (i) => [60, -60][i], duration: 0.3, ease: "back.out(2.5)", stagger: 0.06 }, 4.75);
      tl.fromTo(cat.svg, { y: 0 }, { y: -40, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 4.75);
      EF.catBlink(tl, cat, [5.6]);
      EF.catIdle(tl, cat, 4.9, 6.6, 23);
      tl.set(cat.open, { opacity: 1 }, 4.75); tl.set(cat.closed, { opacity: 0 }, 4.75);
      tl.set(cat.open, { opacity: 0 }, 5.3); tl.set(cat.closed, { opacity: 1 }, 5.3);

      // waiting for the reading
      tl.fromTo("#sh-load", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 5.2);
      tl.fromTo("#sh-bar", { scaleX: 0 }, { scaleX: 0.62, duration: 1.4, ease: "power1.inOut" }, 5.3);
      tl.fromTo("#sh-moon", { rotation: 0 }, { rotation: 200, duration: 1.6, ease: "none" }, 5.2);

      // leave: cream iris swallows the night
      tl.fromTo("#sh-iris", { clipPath: "circle(0px at 540px 560px)" }, { clipPath: "circle(2200px at 540px 560px)", duration: 0.4, ease: "power3.in" }, 6.6);
      window.__timelines["shuffle"] = tl;
    })();
  </script>
</template>
