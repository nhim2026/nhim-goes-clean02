<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #hook-title { position: absolute; left: 0; top: 250px; width: 1080px; text-align: center; }
    #hook-l1 { display: block; font-family: "Nunito", sans-serif; font-weight: 900; font-size: 128px; line-height: 1; color: #f6efdf; letter-spacing: -2px; }
    #hook-l2 { display: inline-block; margin-top: 14px; font-family: "Playfair Display", serif; font-style: italic; font-weight: 700; font-size: 150px; line-height: 1.05; color: #e8c27a; }
    #hook-l1 .hw { display: inline-block; }
    #hook-cards { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #hook-cards .tcard { width: 220px; height: 374px; }
    #hook-iris { position: absolute; inset: 0; background: #f6efdf; }
    #hook-cat { left: 360px; top: 1330px; width: 360px; height: 428px; }
    #hook-moon { position: absolute; left: 790px; top: 150px; width: 120px; height: 120px; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div class="bg-navy"></div>
    <svg id="hook-moon" viewBox="0 0 100 100"><path d="M62 10 A42 42 0 1 0 62 90 A34 34 0 1 1 62 10Z" fill="#E8C27A" opacity=".9"/></svg>
    <canvas id="hook-fx" class="fx-canvas" width="1080" height="1920"></canvas>
    <div id="hook-cards" data-layout-allow-overflow>
      <div class="tcard" id="hook-c1" style="left:200px;top:760px"><div class="inner"><div class="face back back-classic"></div><div class="face front"><img src="assets/cards/sun.jpg" alt="" /></div></div></div>
      <div class="tcard" id="hook-c2" style="left:430px;top:730px"><div class="inner"><div class="face back back-classic"></div><div class="face front"><img src="assets/cards/star.jpg" alt="" /></div></div></div>
      <div class="tcard" id="hook-c3" style="left:660px;top:760px"><div class="inner"><div class="face back back-classic"></div><div class="face front"><img src="assets/cards/moon.jpg" alt="" /></div></div></div>
    </div>
    <div id="hook-title" data-layout-allow-overflow>
      <span id="hook-l1"><span class="hw" id="hook-w1">Tự</span> <span class="hw" id="hook-w2">xem</span> <span class="hw" id="hook-w3">Tarot</span></span>
      <span id="hook-l2">ok hem?</span>
    </div>
    <div id="hook-cat" class="cat-host" data-layout-allow-overflow></div>
    <div id="hook-iris"></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const cat = EF.mountCat(document.getElementById("hook-cat"));
      const fx = EF.starfield(document.getElementById("hook-fx"), { n: 140, seed: 11, big: 12 });
      const bursts = [
        { t: 0.66, x: 310, y: 940, n: 22, seed: 4 },
        { t: 1.02, x: 540, y: 910, n: 22, seed: 5 },
        { t: 1.38, x: 770, y: 940, n: 22, seed: 6 },
        { t: 1.35, x: 760, y: 560, n: 16, spread: 200, seed: 9 },
        { t: 3.25, x: 640, y: 1420, n: 18, seed: 12 },
      ];
      EF.drive(tl, 4, (t) => fx(t, bursts));

      // title on screen at frame 0 (thumbnail) with a small settle
      tl.fromTo("#hook-title", { scale: 0.94 }, { scale: 1, duration: 0.5, ease: "expo.out" }, 0);
      tl.fromTo(["#hook-w1", "#hook-w2", "#hook-w3"], { y: 0 }, { y: -18, duration: 0.09, ease: "power2.out", stagger: 0.26, yoyo: true, repeat: 1 }, 0.22);
      tl.fromTo("#hook-l2", { rotation: -4, scale: 1 }, { rotation: 3, scale: 1.16, duration: 0.12, ease: "back.out(3)" }, 1.3);
      tl.to("#hook-l2", { rotation: -3, scale: 1, duration: 0.35, ease: "elastic.out(1, 0.45)" }, 1.42);

      // cards drop in (staggered, bouncy), then flip on the beat
      const cards = ["#hook-c1", "#hook-c2", "#hook-c3"];
      const rot = [-12, 0, 12];
      cards.forEach((c, i) => {
        tl.fromTo(c, { y: 1200, rotation: rot[i] * 3 }, { y: 0, rotation: rot[i], duration: 0.55, ease: "back.out(1.4)" }, 0.02 + i * 0.08);
        tl.fromTo(c + " .inner", { rotationY: 0 }, { rotationY: 180, duration: 0.42, ease: "back.out(1.6)" }, 0.6 + i * 0.36);
        tl.fromTo(c, { scale: 1 }, { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, 0.6 + i * 0.36);
      });
      // cards make room for the cat
      tl.to(cards, { y: (i) => [-60, -90, -60][i], scale: 0.86, duration: 0.45, ease: "power3.inOut" }, 2.0);

      // cat pops up (anticipation, squash, settle)
      tl.fromTo("#hook-cat", { y: 640 }, { y: 0, duration: 0.42, ease: "back.out(1.5)" }, 2.05);
      tl.fromTo(cat.svg, { scaleY: 1.12, scaleX: 0.9, transformOrigin: "50% 100%" }, { scaleY: 1, scaleX: 1, duration: 0.5, ease: "elastic.out(1, 0.4)" }, 2.42);
      tl.fromTo(cat.armR, { rotation: 0 }, { rotation: -70, duration: 0.25, ease: "back.out(2)" }, 2.5);
      tl.to(cat.armR, { rotation: -40, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.75);
      EF.catTalk(tl, cat, [[2.21, 3.48]]);
      EF.catBlink(tl, cat, [2.9]);
      tl.set(cat.eyeR, { opacity: 0 }, 3.25); tl.set(cat.wink, { opacity: 1 }, 3.25);
      tl.fromTo(cat.head, { rotation: 0 }, { rotation: 10, duration: 0.2, ease: "back.out(2)" }, 3.25);
      EF.catIdle(tl, cat, 2.4, 3.6, 7);

      // iris opens from the cat onto the cream world
      tl.fromTo("#hook-iris", { clipPath: "circle(0px at 540px 1500px)" }, { clipPath: "circle(2300px at 540px 1500px)", duration: 0.5, ease: "power3.in" }, 3.5);
      window.__timelines["hook"] = tl;
    })();
  </script>
</template>
