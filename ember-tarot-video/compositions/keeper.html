    (function () {
      const tl = gsap.timeline({ paused: true });
      const cat = EF.mountCat(document.getElementById("kp-cat"));
      const ans = "Đây là lúc bạn nói thật lòng mình. Chủ động trò chuyện, đừng chờ đợi nữa nha ✦";

      tl.fromTo("#kp-typing", { scale: 0.5, opacity: 0, transformOrigin: "0% 100%" }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2)" }, 0.95);
      [0, 1, 2].forEach((k) => {
        for (let t = 1.0 + k * 0.12; t < 1.95; t += 0.45) tl.fromTo("#kp-typing i:nth-child(" + (k + 1) + ")", { y: 0 }, { y: -8, duration: 0.15, ease: "sine.out", yoyo: true, repeat: 1 }, t);
      });
      tl.to("#kp-typing", { opacity: 0, scale: 0.8, duration: 0.12 }, 2.0);
      tl.fromTo("#kp-a", { scale: 0.6, opacity: 0, transformOrigin: "0% 0%" }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.8)" }, 2.05);

      tl.fromTo("#kp-s", { scale: 0, rotation: -20 }, { scale: 1, rotation: -5, duration: 0.4, ease: "back.out(2.5)" }, 1.5);
      // cat reads along and nods
      tl.fromTo("#kp-cat", { y: 520, rotation: 14 }, { y: 0, rotation: 10, duration: 0.45, ease: "back.out(1.6)" }, 0.4);
      tl.to(cat.pupils, { x: 8, y: -10, duration: 0.25, ease: "power2.out" }, 0.8);
      tl.to(cat.head, { rotation: 8, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 3 }, 2.3);
      EF.catBlink(tl, cat, [1.4, 3.0]);
      tl.to(cat.tail, { rotation: 18, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 4 }, 0.9);

      window.__timelines["keeper"] = tl;
